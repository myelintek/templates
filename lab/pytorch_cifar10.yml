name: Pytorch Cifar10
author: MLSteam
description: Cifar10 in Pytorch
format: v2
type: lab
version: "1.0.2"
env:
  image: myelintek/pytorch-cifar10:1.0.2
  volumes:
    - cifar10:/mlsteam/data/cifar10
  requirements:
    gpu: 1
hashtag:
  - classification
  - pytorch
runtime_params:
  command: python train.py
  params:
    network:
    - resnet18
    num_epochs: 5
  params_definition:
    network:
      options:
      - mobilenet_v2
      - inception_v3
      - googlenet
      - resnet18
      - vgg11_bn