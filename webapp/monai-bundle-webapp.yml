format: v3
type: webapp
driver: pod
metadata:
  name: Monaibundle
  version: "0.7.0.2"
  author: MLSteam
  description: MonAI bundle WebAppp
  tags:
  - Labeling Tool
  - MONAI
  - 3D Slicer
env:
  command: |
    python -m monai.bundle download "$MODEL" --bundle_dir "/models/monaibundle/model" &&
    mkdir -p /data/$MODEL &&
    monailabel start_server --app /models/monaibundle --studies /data/$MODEL --conf models $MODEL
  image: projectmonai/monailabel:0.7.0
  requirements: {}
  volumes:
  - data:/data
  - models:/models
params:
  portmaps:
  - port: 8000
    service:
      type: Ingress
      protocol: http
  models:
  - model: wholeBody_ct_segmentation
    required: false
  folders:
  - folder: data
    mountPath: /data
    required: true
  - folder: models
    mountPath: /models
    required: true
