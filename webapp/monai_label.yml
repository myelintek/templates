format: v3
type: webapp
driver: pod
metadata:
  name: MonAI Label
  version: v0.6.1
  author: MLSteam
  description: MonAI
  tags:
  - Labeling Tool
  - MONAI
  - 3D Slicer
env:
  command: | 
    monailabel apps &&
    monailabel apps --download --name radiology --output apps &&
    monailabel datasets &&
    monailabel datasets --download --name Task09_Spleen --output datasets &&
    monailabel start_server --app apps/radiology --studies datasets/Task09_Spleen/imagesTr --conf models deepedit
  image: projectmonai/monailabel:0.6.0
  requirements: {}
params:
  portmaps:
  - port: "8000/tcp"
    service:
      type: nodePort
      protocol: http
  folders:
  - folder: yolo-sample:/data
    required: true
