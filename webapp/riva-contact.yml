format: v3
type: webapp
driver: pod
metadata:
  name: Riva-Contact
  version: 1.0.0
  author: MLSteam
  description: Riva-Contact WebApp
  tags:
  - speech to text
  - Riva
env:
  command: |
    nohup start-riva --riva-uri=0.0.0.0:50051 \
        --asr_service=true \
        --tts_service=true \
        --nlp_service=true &
    sleep 10
    cd /data/riva-contact &&
    npm install &&
    npm run start
  image: myelintek/riva-contact:rc1
  requirements: {}
params:
  portmaps:
  - port: 8009/tcp
    service:
      type: NodePort
      protocol: https
  - port: 9000/tcp
    service:
      type: NodePort
      protocol: https
