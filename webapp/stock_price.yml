format: v3
type: webapp
driver: pod
metadata:
  name: Stock price LSTM Inference
  version: '2.0'
  author: MLSteam
  description: LSTM to predict the stock price. Please select a model version, which contains "scaler.pkl" and the model folder "1/".
  tags:
  - Stock prices prediction
  - LSTM
env:
  command: (tensorflow_model_server --rest_api_port=5050 --model_name=stock_pred --model_base_path=/working/ & ) && streamlit run web.py --server.headless=true --server.enableWebsocketCompression=false
  image: myelintek/stock-pred:1.0
params:
  portmaps:
  - port: 8501
    service:
      type: Ingress
      protocol: http
  models:
  - model: stock_pred
    mountPath: /working
    required: true
