format: v3
type: webapp
driver: pod
metadata:
  name: YOLOv5 Inference
  version: v1.0.5
  author: MLSteam
  description: |
    YOLOv5 inference service (backend: PyTorch 1.10.3).
    The model should have a "yolov5.pt" file.
  tags:
  - Object Detection
  - YOLOv5
  - Pytorch
env:
  command: streamlit run --server.enableXsrfProtection=false streamlit.py -- --device=0
  image: myelintek/yolov5:v6.1-mls-1.0.3
  requirements:
    gpu: 1
    memory: 8192
params:
  portmaps:
  - port: 8501
    service:
      type: Ingress
      protocol: http
  models:
  - model: yolo
    mountPath: /working
    required: true
