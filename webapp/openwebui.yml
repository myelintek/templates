format: v3
type: webapp
driver: pod
metadata:
  name: Open WebUI for LLM
  version: '1.0'
  author: MLSteam
  description: Open WebUI for AI user interface.
  tags:
  - OpenWebUI
  - LLM
env:
  command: bash /app/backend/start.sh
  image: ghcr.io/open-webui/open-webui:main
params:
  portmaps:
  - port: 8080
    service:
      type: NodePort
      protocol: http
  folders:
  - folder: appdata:/app/backend/data
    required: true
  vars:
  - name: OLLAMA_BASE_URL
    type: string
    default: https://example.com
    visible: true
    readOnly: false
  - name: WEBUI_AUTH
    type: string
    default: 'false'
    visible: true
    readOnly: false
